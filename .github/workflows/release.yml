name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path installer/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # Build the plugin JS package once (platform-independent) and share it with the
  # per-target build jobs. See ci/stage-plugin.sh for why we ship a pruned
  # node_modules instead of bundling or a full install.
  plugin:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp plugin version
        run: |
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          npm --no-git-tag-version version "$v" --allow-same-version
          echo "stamped plugin $v"
      - name: Stage plugin package
        run: bash ci/stage-plugin.sh staged
      - name: Tarball the staged package
        run: tar czf plugin.tar.gz -C staged plugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: plugin.tar.gz

  build:
    needs: [test, plugin]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp version (so `--version` matches the release)
        run: |
          # Version = Conventional-Commit semver from history (never bump by hand):
          #   feat: -> minor | fix:/other -> patch | type!: breaking -> major (baseline 1.0.0)
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          tmp=$(mktemp)
          sed -E "s/^version = \"[^\"]*\"/version = \"$v\"/" installer/Cargo.toml > "$tmp" && mv "$tmp" installer/Cargo.toml
          echo "stamped $v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --manifest-path installer/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path installer/Cargo.toml --target ${{ matrix.target }}
          fi
      - uses: actions/download-artifact@v8
        with:
          name: plugin
      - name: Package (binary + plugin JS)
        run: |
          tar xzf plugin.tar.gz          # -> ./plugin
          pkg=$(mktemp -d)
          cp "installer/target/${{ matrix.target }}/release/opencode-provider-manager" "$pkg/"
          cp -R plugin "$pkg/plugin"
          mkdir -p dist
          tar czf "dist/opencode-provider-manager-${{ matrix.target }}.tar.gz" \
            -C "$pkg" opencode-provider-manager plugin
      - name: Emit Homebrew bottle tag (macOS)
        if: runner.os == 'macOS'
        run: |
          host=$(brew ruby -e 'puts Utils::Bottles.tag.to_s' 2>/dev/null)
          codename=${host#arm64_}
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) tag="arm64_${codename}" ;;
            x86_64-apple-darwin)  tag="${codename}" ;;
          esac
          printf '%s' "$tag" > "dist/${{ matrix.target }}.bottletag"
          echo "bottle tag: $tag"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: art
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          name=opencode-provider-manager

          # Repackage the prebuilt binary + plugin as Homebrew bottles so `brew
          # install` POURS them. A poured bottle skips `install`, so each keg must
          # already hold everything install produces: binary + man + completions +
          # libexec/plugin. man/completions are identical on every platform, so
          # render them once from the Linux binary.
          tmp=$(mktemp -d); ex0=$(mktemp -d)
          tar xzf "art/${name}-x86_64-unknown-linux-musl.tar.gz" -C "$ex0"
          "$ex0/$name" man              > "$tmp/${name}.1"
          "$ex0/$name" completions zsh  > "$tmp/_${name}"
          "$ex0/$name" completions bash > "$tmp/${name}.bash"
          "$ex0/$name" completions fish > "$tmp/${name}.fish"

          # make_bottle <binary-tarball-in-art> <homebrew-tag> -> prints sha256
          make_bottle() {
            keg="${name}/${VERSION}"
            root="stage-$2"
            rm -rf "$root"
            mkdir -p "$root/$keg/bin" \
                     "$root/$keg/libexec" \
                     "$root/$keg/share/man/man1" \
                     "$root/$keg/share/zsh/site-functions" \
                     "$root/$keg/share/bash-completion/completions" \
                     "$root/$keg/share/fish/vendor_completions.d"
            ex=$(mktemp -d); tar xzf "art/$1" -C "$ex"
            cp "$ex/$name" "$root/$keg/bin/$name"
            cp -R "$ex/plugin" "$root/$keg/libexec/plugin"
            cp "$tmp/${name}.1"    "$root/$keg/share/man/man1/${name}.1"
            cp "$tmp/_${name}"     "$root/$keg/share/zsh/site-functions/_${name}"
            cp "$tmp/${name}.bash" "$root/$keg/share/bash-completion/completions/${name}"
            cp "$tmp/${name}.fish" "$root/$keg/share/fish/vendor_completions.d/${name}.fish"
            ( cd "$root" && tar czf "../art/${name}-${VERSION}.$2.bottle.tar.gz" "$name" )
            sha256sum "art/${name}-${VERSION}.$2.bottle.tar.gz" | awk '{print $1}'
          }

          ARM_TAG=$(cat art/aarch64-apple-darwin.bottletag)
          X86_TAG=$(cat art/x86_64-apple-darwin.bottletag)
          {
            echo "BOTTLE_SHA=$(make_bottle ${name}-x86_64-unknown-linux-musl.tar.gz x86_64_linux)"
            echo "MAC_ARM_BOTTLE_SHA=$(make_bottle ${name}-aarch64-apple-darwin.tar.gz "$ARM_TAG")"
            echo "MAC_X86_BOTTLE_SHA=$(make_bottle ${name}-x86_64-apple-darwin.tar.gz "$X86_TAG")"
            echo "MAC_CODENAME=${ARM_TAG#arm64_}"
          } >> "$GITHUB_ENV"

          gh release create "v$VERSION" art/*.tar.gz \
            --title "v$VERSION" --notes "Automated build from ${GITHUB_SHA:0:7}" \
            || gh release upload "v$VERSION" art/*.tar.gz --clobber
      - name: Prune old releases (keep the latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); do
            gh release delete "$t" --cleanup-tag -y || true
          done
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          name=opencode-provider-manager
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY not set — built & released, but skipping the tap update."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          sha() { sha256sum "art/${name}-$1.tar.gz" | awk '{print $1}'; }
          sed -e "s/@VERSION@/${VERSION}/g" \
            -e "s/@MAC_CODENAME@/${MAC_CODENAME}/g" \
            -e "s/@BOTTLE_SHA@/${BOTTLE_SHA}/g" \
            -e "s/@MAC_ARM_BOTTLE_SHA@/${MAC_ARM_BOTTLE_SHA}/g" \
            -e "s/@MAC_X86_BOTTLE_SHA@/${MAC_X86_BOTTLE_SHA}/g" \
            -e "s/@X86_SHA@/$(sha x86_64-unknown-linux-musl)/g" \
            -e "s/@ARM_SHA@/$(sha aarch64-unknown-linux-musl)/g" \
            -e "s/@MAC_X86_SHA@/$(sha x86_64-apple-darwin)/g" \
            -e "s/@MAC_ARM_SHA@/$(sha aarch64-apple-darwin)/g" \
            "ci/${name}.rb.tmpl" > "/tmp/${name}.rb"
          git clone git@github.com:jakobhviid/homebrew-tap tap
          mkdir -p tap/Formula
          cp "/tmp/${name}.rb" "tap/Formula/${name}.rb"
          cd tap
          git config user.name "tap-bot"
          git config user.email "tap-bot@users.noreply.github.com"
          git add "Formula/${name}.rb"
          git commit -m "${name} ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
